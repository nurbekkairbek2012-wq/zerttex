[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# The web app calls /api/chat; on Netlify this maps to the serverless function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
